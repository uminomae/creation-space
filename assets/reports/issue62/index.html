<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue #62 学術分冊ハブ</title>
  <style>
    :root {
      --bg: #0a0e16;
      --panel: #12192a;
      --panel-soft: #0f1626;
      --line: #2d3e5d;
      --text: #e7eefc;
      --sub: #a8b9db;
      --link: #8dc2ff;
      --ok: #4fc37b;
      --wait: #e0ac4c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Serif JP", "Yu Mincho", serif;
      background: radial-gradient(circle at 20% 10%, #1a2338 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }
    h1 { margin: 0 0 6px; font-size: clamp(1.3rem, 3vw, 1.9rem); }
    .sub { color: var(--sub); margin: 0 0 18px; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 20px;
    }
    .links a {
      color: var(--link);
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.9rem;
    }
    .summary {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
      color: var(--sub);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(45, 62, 93, 0.55);
      text-align: left;
      font-size: 0.92rem;
      vertical-align: top;
    }
    th { color: #c9daf8; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
    }
    .status-published { background: rgba(79, 195, 123, 0.2); color: var(--ok); }
    .status-planned { background: rgba(224, 172, 76, 0.2); color: var(--wait); }
    a { color: var(--link); }
    .muted { color: #8ea1c7; }
    .footnote {
      margin-top: 14px;
      color: var(--sub);
      font-size: 0.88rem;
    }
    @media (max-width: 760px) {
      th:nth-child(4), td:nth-child(4) { display: none; }
      th, td { font-size: 0.86rem; padding: 9px 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Issue #62 学術分冊ハブ</h1>
    <p class="sub">30領域の分冊PDF/Markdownへの導線。公開済みと準備中を同じ表で確認できます。</p>

    <div class="links">
      <a href="./creation-issue62-status-ja.pdf" target="_blank" rel="noopener">5W1H作業報告 PDF</a>
      <a href="./issue62-status-ja.md" target="_blank" rel="noopener">5W1H作業報告 Markdown</a>
      <a href="./issue62-domain-index-ja.md" target="_blank" rel="noopener">分冊インデックス Markdown</a>
    </div>

    <div class="summary" id="summary">読み込み中...</div>

    <table aria-label="Issue #62 30領域分冊一覧">
      <thead>
        <tr>
          <th style="width: 11%;">ID</th>
          <th style="width: 25%;">領域</th>
          <th style="width: 16%;">状態</th>
          <th style="width: 20%;">Markdown</th>
          <th style="width: 20%;">PDF</th>
        </tr>
      </thead>
      <tbody id="domainRows">
        <tr><td colspan="5" class="muted">読み込み中...</td></tr>
      </tbody>
    </table>

    <p class="footnote">注: 「公開済み」はこの`creation-space`に配置済みの成果物を示します。「準備中」は今後追加予定です。</p>
  </div>

  <script>
    async function load() {
      const summary = document.getElementById('summary');
      const rows = document.getElementById('domainRows');
      try {
        const res = await fetch('./domains/index.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('Failed to load index.json');
        const data = await res.json();
        const list = Array.isArray(data.reports) ? data.reports : [];
        const published = list.filter((r) => r.status === 'published').length;
        const planned = list.length - published;

        summary.textContent =
          `更新日: ${data.generated_at || 'n/a'} / 公開済み ${published} 件 / 準備中 ${planned} 件 / 全 ${list.length} 領域`;

        rows.innerHTML = '';
        for (const item of list) {
          const tr = document.createElement('tr');
          const isPublished = item.status === 'published';
          const mdCell = isPublished && item.md
            ? `<a href="${item.md}" target="_blank" rel="noopener">開く</a>`
            : '<span class="muted">準備中</span>';
          const pdfCell = isPublished && item.pdf
            ? `<a href="${item.pdf}" target="_blank" rel="noopener">開く</a>`
            : '<span class="muted">準備中</span>';
          tr.innerHTML = `
            <td>${item.id || '-'}</td>
            <td>${item.name_ja || '-'}</td>
            <td><span class="status ${isPublished ? 'status-published' : 'status-planned'}">${isPublished ? '公開済み' : '準備中'}</span></td>
            <td>${mdCell}</td>
            <td>${pdfCell}</td>
          `;
          rows.appendChild(tr);
        }
      } catch (err) {
        summary.textContent = '読み込みに失敗しました。';
        rows.innerHTML = '<tr><td colspan="5" class="muted">index.json の読み込みに失敗しました。</td></tr>';
        console.warn('[issue62 hub] load failed:', err);
      }
    }
    load();
  </script>
</body>
</html>
