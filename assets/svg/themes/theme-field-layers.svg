<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowFL" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666666"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
    .subtitle { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #666666; }
    .theme-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 18px; font-weight: bold; }
    .theme-sub { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; }
    .layer-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 16px; font-weight: bold; }
    .layer-desc { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    .domain-id { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #2C2C2C; font-weight: bold; }
    .domain-desc { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
    .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
    .summary-note { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
  </style>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" class="title">T6 場の多層性 — 横断的パターン図</text>
  <text x="400" y="68" text-anchor="middle" class="subtitle">原初的/循環的/存在論的 (15/30ドメインが直接主題化)</text>

  <!-- Central theme node - Field/Ba color -->
  <ellipse cx="400" cy="255" rx="100" ry="50" fill="#8B8682" opacity="0.15" stroke="#8B8682" stroke-width="2.5"/>
  <text x="400" y="248" text-anchor="middle" class="theme-label" fill="#8B8682">場の多層性</text>
  <text x="400" y="270" text-anchor="middle" class="theme-sub" fill="#8B8682">空虚でなく条件付き潜在性</text>

  <!-- Layer 1: 原初的場 (upper-left) -->
  <rect x="55" y="100" width="160" height="70" rx="10" fill="#8B8682" opacity="0.1" stroke="#8B8682" stroke-width="2"/>
  <text x="135" y="125" text-anchor="middle" class="layer-title" fill="#8B8682">原初的場</text>
  <text x="135" y="145" text-anchor="middle" class="layer-desc">構造がまだ存在しない</text>
  <text x="135" y="160" text-anchor="middle" class="layer-desc">未分節状態</text>
  <line x1="215" y1="140" x2="305" y2="240" stroke="#8B8682" stroke-width="2"/>

  <!-- Original field domain nodes -->
  <circle cx="70" cy="210" r="20" fill="#8B8682" opacity="0.2" stroke="#8B8682" stroke-width="1"/>
  <text x="70" y="215" text-anchor="middle" class="domain-id">D01</text>
  <text x="70" y="246" text-anchor="middle" class="domain-desc">未構造化空間</text>
  <line x1="85.62" y1="197.50" x2="120" y2="170" stroke="#8B8682" stroke-width="1" stroke-dasharray="4,2"/>

  <circle cx="145" cy="220" r="20" fill="#8B8682" opacity="0.2" stroke="#8B8682" stroke-width="1"/>
  <text x="145" y="225" text-anchor="middle" class="domain-id">D06</text>
  <text x="145" y="256" text-anchor="middle" class="domain-desc">星間分子雲</text>
  <line x1="145.00" y1="200.00" x2="145" y2="170" stroke="#8B8682" stroke-width="1" stroke-dasharray="4,2"/>

  <circle cx="220" cy="210" r="20" fill="#5B8DB8" opacity="0.2" stroke="#5B8DB8" stroke-width="1"/>
  <text x="220" y="215" text-anchor="middle" class="domain-id">D02</text>
  <text x="220" y="246" text-anchor="middle" class="domain-desc">量子真空(揺らぎの海)</text>
  <line x1="205.86" y1="195.86" x2="180" y2="170" stroke="#8B8682" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Layer 2: 循環的場 (upper-right) -->
  <rect x="575" y="100" width="180" height="70" rx="10" fill="#5B8DB8" opacity="0.1" stroke="#5B8DB8" stroke-width="2"/>
  <text x="665" y="125" text-anchor="middle" class="layer-title" fill="#5B8DB8">循環的場</text>
  <text x="665" y="145" text-anchor="middle" class="layer-desc">前の束が初期条件を提供</text>
  <text x="665" y="160" text-anchor="middle" class="layer-desc">構造化された状態</text>
  <line x1="580" y1="145" x2="495" y2="240" stroke="#5B8DB8" stroke-width="2"/>

  <!-- Circular field domain nodes -->
  <circle cx="580" cy="210" r="20" fill="#5B8DB8" opacity="0.2" stroke="#5B8DB8" stroke-width="1"/>
  <text x="580" y="215" text-anchor="middle" class="domain-id">D04</text>
  <text x="580" y="246" text-anchor="middle" class="domain-desc">遺伝子プール</text>
  <line x1="594.14" y1="195.86" x2="620" y2="170" stroke="#5B8DB8" stroke-width="1" stroke-dasharray="4,2"/>

  <circle cx="660" cy="220" r="20" fill="#5B8DB8" opacity="0.2" stroke="#5B8DB8" stroke-width="1"/>
  <text x="660" y="225" text-anchor="middle" class="domain-id">D05</text>
  <text x="660" y="256" text-anchor="middle" class="domain-desc">地球システム</text>
  <line x1="660.00" y1="200.00" x2="660" y2="170" stroke="#5B8DB8" stroke-width="1" stroke-dasharray="4,2"/>

  <circle cx="740" cy="210" r="20" fill="#5B8B6A" opacity="0.2" stroke="#5B8B6A" stroke-width="1"/>
  <text x="740" y="215" text-anchor="middle" class="domain-id">D09</text>
  <text x="740" y="246" text-anchor="middle" class="domain-desc">幹細胞ニッチ</text>
  <line x1="728.00" y1="194.00" x2="710" y2="170" stroke="#5B8DB8" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Layer 3: 存在論的場 (bottom) -->
  <rect x="300" y="360" width="200" height="70" rx="10" fill="#D4A857" opacity="0.1" stroke="#D4A857" stroke-width="2"/>
  <text x="400" y="385" text-anchor="middle" class="layer-title" fill="#D4A857">存在論的場(3レベル?)</text>
  <text x="400" y="405" text-anchor="middle" class="layer-desc">経験的/存在論的/究極的</text>
  <text x="400" y="420" text-anchor="middle" class="theme-sub" fill="#D4A857">(保持論点: 5段階の射程内か?)</text>
  <line x1="400" y1="305" x2="400" y2="360" stroke="#D4A857" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Ontological field domain nodes -->
  <circle cx="250" cy="440" r="20" fill="#D4A857" opacity="0.2" stroke="#D4A857" stroke-width="1"/>
  <text x="250" y="445" text-anchor="middle" class="domain-id">D13</text>
  <text x="250" y="476" text-anchor="middle" class="domain-desc">西田の絶対無</text>
  <line x1="265.62" y1="427.50" x2="300" y2="400" stroke="#D4A857" stroke-width="1" stroke-dasharray="4,2"/>

  <circle cx="550" cy="440" r="20" fill="#D4A857" opacity="0.2" stroke="#D4A857" stroke-width="1"/>
  <text x="550" y="445" text-anchor="middle" class="domain-id">D24</text>
  <text x="550" y="476" text-anchor="middle" class="domain-desc">仏教の空</text>
  <line x1="534.38" y1="427.50" x2="500" y2="400" stroke="#D4A857" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Convergence summary -->
  <rect x="40" y="490" width="720" height="90" rx="8" fill="#FAFAF8" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="515" class="summary-title">収束点</text>
  <text x="60" y="537" class="summary-text">1. 原初的場 vs 循環的場の区別は普遍的 [P] (10ドメインが独立に提案)</text>
  <text x="60" y="555" class="summary-text">2. 場は空虚でなく条件付き潜在性 [M] | 3. 場は全段階の基盤条件 [S] | 4. 循環的場の質が創造の質を決める [M]</text>
  <text x="60" y="568" class="summary-note">分岐: 場は「前提」か「到達物」か (D28舞台芸術: 場は実践的達成 vs D06天文: 所与の初期条件)</text>
</svg>
