<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowTH" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666666"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
    .subtitle { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #666666; }
    .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 16px; font-weight: bold; }
    .stage-sub { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; }
    .threshold-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; fill: #C45B4D; font-weight: bold; }
    .conv-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: bold; }
    .conv-desc { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    .domain-id { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #2C2C2C; font-weight: bold; }
    .domain-desc { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    .note { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; }
    .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
    .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
    .summary-note { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
  </style>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" class="title">T2 閾値構造と縁→渦遷移 — 横断的パターン図</text>
  <text x="400" y="68" text-anchor="middle" class="subtitle">縁→渦遷移の条件 (11ドメインが直接主題化、10が渦不到達を記述)</text>

  <!-- Central theme: transition between En and Uzu -->
  <rect x="290" y="209" width="90" height="70" rx="10" fill="#D4A857" opacity="0.15" stroke="#D4A857" stroke-width="2"/>
  <text x="335" y="242" text-anchor="middle" class="stage-label" fill="#D4A857">縁</text>
  <text x="335" y="262" text-anchor="middle" class="stage-sub" fill="#D4A857">Edge</text>

  <!-- Threshold bar -->
  <rect x="395" y="214" width="10" height="60" rx="2" fill="#C45B4D" opacity="0.5"/>
  <text x="400" y="199" text-anchor="middle" class="threshold-label">閾値</text>

  <rect x="420" y="209" width="90" height="70" rx="10" fill="#C45B4D" opacity="0.15" stroke="#C45B4D" stroke-width="2"/>
  <text x="465" y="242" text-anchor="middle" class="stage-label" fill="#C45B4D">渦</text>
  <text x="465" y="262" text-anchor="middle" class="stage-sub" fill="#C45B4D">Vortex</text>

  <!-- Arrow across threshold -->
  <line x1="380" y1="244" x2="415" y2="244" stroke="#C45B4D" stroke-width="2.5" marker-end="url(#arrowTH)"/>

  <!-- Convergence 1: 閾値的 (top-left) -->
  <rect x="50" y="104" width="200" height="55" rx="8" fill="#C45B4D" opacity="0.1" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="150" y="126" text-anchor="middle" class="conv-title" fill="#C45B4D">連続的でなく閾値的 [P]</text>
  <text x="150" y="146" text-anchor="middle" class="conv-desc">物理化学的に最も堅い知見</text>
  <line x1="250" y1="132" x2="300" y2="214" stroke="#C45B4D" stroke-width="1.5"/>

  <!-- Domain nodes for convergence 1 -->
  <circle cx="70" cy="184" r="20" fill="#C45B4D" opacity="0.15" stroke="#C45B4D" stroke-width="1"/>
  <text x="70" y="189" text-anchor="middle" class="domain-id">D02</text>
  <text x="70" y="215" text-anchor="middle" class="domain-desc">相転移</text>

  <circle cx="130" cy="184" r="20" fill="#C45B4D" opacity="0.15" stroke="#C45B4D" stroke-width="1"/>
  <text x="130" y="189" text-anchor="middle" class="domain-id">D03</text>
  <text x="130" y="215" text-anchor="middle" class="domain-desc">活性化E</text>

  <circle cx="190" cy="184" r="20" fill="#C45B4D" opacity="0.15" stroke="#C45B4D" stroke-width="1"/>
  <text x="190" y="189" text-anchor="middle" class="domain-id">D05</text>
  <text x="190" y="215" text-anchor="middle" class="domain-desc">tipping pt</text>

  <!-- Convergence 2: 不可逆 (top-right) -->
  <rect x="560" y="104" width="190" height="55" rx="8" fill="#D4A857" opacity="0.1" stroke="#D4A857" stroke-width="1.5"/>
  <text x="655" y="126" text-anchor="middle" class="conv-title" fill="#D4A857">遷移は不可逆的 [P]</text>
  <text x="655" y="146" text-anchor="middle" class="conv-desc">縁に戻れない(系は循環する)</text>
  <line x1="560" y1="132" x2="510" y2="214" stroke="#D4A857" stroke-width="1.5"/>

  <circle cx="600" cy="184" r="20" fill="#D4A857" opacity="0.15" stroke="#D4A857" stroke-width="1"/>
  <text x="600" y="189" text-anchor="middle" class="domain-id">D04</text>
  <text x="600" y="215" text-anchor="middle" class="domain-desc">種分化</text>

  <circle cx="660" cy="184" r="20" fill="#D4A857" opacity="0.15" stroke="#D4A857" stroke-width="1"/>
  <text x="660" y="189" text-anchor="middle" class="domain-id">D06</text>
  <text x="660" y="215" text-anchor="middle" class="domain-desc">重力崩壊</text>

  <circle cx="720" cy="184" r="20" fill="#D4A857" opacity="0.15" stroke="#D4A857" stroke-width="1"/>
  <text x="720" y="189" text-anchor="middle" class="domain-id">D29</text>
  <text x="720" y="215" text-anchor="middle" class="domain-desc">SOC</text>

  <!-- Convergence 3: 制御可能 (bottom-left) -->
  <rect x="50" y="304" width="200" height="55" rx="8" fill="#5B8B6A" opacity="0.1" stroke="#5B8B6A" stroke-width="1.5"/>
  <text x="150" y="326" text-anchor="middle" class="conv-title" fill="#5B8B6A">閾値は制御可能 [M]</text>
  <text x="150" y="346" text-anchor="middle" class="conv-desc">上げる/下げる操作が存在</text>
  <line x1="250" y1="324" x2="310" y2="274" stroke="#5B8B6A" stroke-width="1.5"/>

  <circle cx="70" cy="384" r="20" fill="#5B8B6A" opacity="0.15" stroke="#5B8B6A" stroke-width="1"/>
  <text x="70" y="389" text-anchor="middle" class="domain-id">D03</text>
  <text x="70" y="415" text-anchor="middle" class="domain-desc">触媒=閾値低下</text>

  <circle cx="150" cy="384" r="20" fill="#5B8B6A" opacity="0.15" stroke="#5B8B6A" stroke-width="1"/>
  <text x="150" y="389" text-anchor="middle" class="domain-id">D27</text>
  <text x="150" y="415" text-anchor="middle" class="domain-desc">threshold space</text>

  <circle cx="230" cy="384" r="20" fill="#5B8B6A" opacity="0.15" stroke="#5B8B6A" stroke-width="1"/>
  <text x="230" y="389" text-anchor="middle" class="domain-id">D3</text>
  <text x="230" y="415" text-anchor="middle" class="domain-desc">抱持=閾値上昇</text>

  <!-- Convergence 4: 渦不到達 (bottom-right) -->
  <rect x="560" y="304" width="190" height="55" rx="8" fill="#8B8682" opacity="0.1" stroke="#8B8682" stroke-width="1.5"/>
  <text x="655" y="326" text-anchor="middle" class="conv-title" fill="#8B8682">渦不到達経路 [P]</text>
  <text x="655" y="346" text-anchor="middle" class="conv-desc">縁で止まる/場に戻る</text>
  <line x1="560" y1="324" x2="510" y2="274" stroke="#8B8682" stroke-width="1.5"/>

  <circle cx="580" cy="384" r="20" fill="#8B8682" opacity="0.15" stroke="#8B8682" stroke-width="1"/>
  <text x="580" y="389" text-anchor="middle" class="domain-id">D07</text>
  <text x="580" y="415" text-anchor="middle" class="domain-desc">安定制御</text>

  <circle cx="650" cy="384" r="20" fill="#8B8682" opacity="0.15" stroke="#8B8682" stroke-width="1"/>
  <text x="650" y="389" text-anchor="middle" class="domain-id">D14</text>
  <text x="650" y="415" text-anchor="middle" class="domain-desc">固着</text>

  <circle cx="720" cy="384" r="20" fill="#8B8682" opacity="0.15" stroke="#8B8682" stroke-width="1"/>
  <text x="720" y="389" text-anchor="middle" class="domain-id">D25</text>
  <text x="720" y="415" text-anchor="middle" class="domain-desc">schism</text>

  <!-- D3 connection highlight -->
  <rect x="285" y="304" width="230" height="40" rx="6" fill="#D4A857" opacity="0.08" stroke="#D4A857" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="329" text-anchor="middle" class="note" fill="#D4A857">触媒=閾値低下 / D3抱持=閾値上昇 (対称性)</text>

  <!-- Summary -->
  <rect x="40" y="454" width="720" height="130" rx="8" fill="#FAFAF8" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="479" class="summary-title">収束点と保持論点</text>
  <text x="60" y="501" class="summary-text">1. 縁→渦遷移は連続的でなく閾値的 [P] | 2. 閾値超え遷移は不可逆的 [P]</text>
  <text x="60" y="519" class="summary-text">3. 閾値は制御可能な場合がある [M] | 4. 渦に至らない経路が存在する [P]</text>
  <text x="60" y="541" class="summary-note">分岐1: 閾値は量的か質的か (D02物理 vs D24宗教 vs D14心理)</text>
  <text x="60" y="559" text-anchor="start" class="summary-note">分岐2: 「帯域」と「閾値」の統合 — 帯域の中に閾値があるのか、端が閾値か</text>
  <text x="60" y="577" text-anchor="start" class="summary-note">分岐3: 渦は必ず創造的か — Minsky(D21)の信用崩壊は破壊的渦</text>
</svg>
