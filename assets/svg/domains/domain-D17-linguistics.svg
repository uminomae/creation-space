<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowD17" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <style>
      .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
      .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #FAFAF8; font-weight: bold; }
      .concept { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
      .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
      .stage-sub { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #FAFAF8; }
      .legend { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" class="title">D17 言語学 — 5段階モデルとの構造対応図</text>

  <!-- Stage boxes -->
  <!-- Field -->
  <rect x="50" y="100" width="120" height="70" rx="8" fill="#8B8682"/>
  <text x="110" y="128" text-anchor="middle" class="stage-label">場（Field）</text>
  <text x="110" y="148" text-anchor="middle" class="stage-sub">多義性と変異の蓄積</text>

  <!-- Wave -->
  <rect x="200" y="100" width="120" height="70" rx="8" fill="#5B8DB8"/>
  <text x="260" y="128" text-anchor="middle" class="stage-label">波（Wave）</text>
  <text x="260" y="148" text-anchor="middle" class="stage-sub">推論と変異の増幅</text>

  <!-- Edge -->
  <rect x="350" y="100" width="120" height="70" rx="8" fill="#D4A857"/>
  <text x="410" y="128" text-anchor="middle" class="stage-label">縁（Edge）</text>
  <text x="410" y="148" text-anchor="middle" class="stage-sub">機能分化の臨界</text>

  <!-- Vortex -->
  <rect x="500" y="100" width="120" height="70" rx="8" fill="#C45B4D"/>
  <text x="560" y="128" text-anchor="middle" class="stage-label">渦（Vortex）</text>
  <text x="560" y="148" text-anchor="middle" class="stage-sub">文法の自発的成立</text>

  <!-- Bundle -->
  <rect x="650" y="100" width="120" height="70" rx="8" fill="#5B8B6A"/>
  <text x="710" y="128" text-anchor="middle" class="stage-label">束（Bundle）</text>
  <text x="710" y="148" text-anchor="middle" class="stage-sub">体系の定着・伝承</text>

  <!-- Arrows between stages -->
  <line x1="170" y1="135" x2="198" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD17)"/>
  <line x1="320" y1="135" x2="348" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD17)"/>
  <line x1="470" y1="135" x2="498" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD17)"/>
  <line x1="620" y1="135" x2="648" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD17)"/>

  <!-- Concepts under each stage -->
  <!-- Field concepts -->
  <line x1="110" y1="170" x2="110" y2="195" stroke="#8B8682" stroke-width="2"/>
  <rect x="45" y="195" width="130" height="90" rx="6" fill="none" stroke="#8B8682" stroke-width="1.5"/>
  <text x="110" y="215" text-anchor="middle" class="concept">語彙の多義性</text>
  <text x="110" y="235" text-anchor="middle" class="concept">使用事例の蓄積</text>
  <text x="110" y="255" text-anchor="middle" class="concept">ランダム初期状態</text>

  <!-- Wave concepts -->
  <line x1="260" y1="170" x2="260" y2="195" stroke="#5B8DB8" stroke-width="2"/>
  <rect x="195" y="195" width="130" height="90" rx="6" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
  <text x="260" y="215" text-anchor="middle" class="concept">語用論的推論</text>
  <text x="260" y="235" text-anchor="middle" class="concept">発音変異の増幅</text>
  <text x="260" y="255" text-anchor="middle" class="concept">世代間の変異</text>

  <!-- Edge concepts -->
  <line x1="410" y1="170" x2="410" y2="195" stroke="#D4A857" stroke-width="2"/>
  <rect x="345" y="195" width="130" height="90" rx="6" fill="none" stroke="#D4A857" stroke-width="1.5"/>
  <text x="410" y="215" text-anchor="middle" class="concept">機能分化・装置割当</text>
  <text x="410" y="235" text-anchor="middle" class="concept">制約ランキング</text>
  <text x="410" y="255" text-anchor="middle" class="concept">伝達ボトルネック</text>

  <!-- Vortex concepts -->
  <line x1="560" y1="170" x2="560" y2="195" stroke="#C45B4D" stroke-width="2"/>
  <rect x="495" y="195" width="130" height="90" rx="6" fill="none" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="560" y="215" text-anchor="middle" class="concept">文法体系の成立</text>
  <text x="560" y="235" text-anchor="middle" class="concept">組合せ構造の創発</text>
  <text x="560" y="255" text-anchor="middle" class="concept">構文の成立</text>

  <!-- Bundle concepts -->
  <line x1="710" y1="170" x2="710" y2="195" stroke="#5B8B6A" stroke-width="2"/>
  <rect x="645" y="195" width="130" height="90" rx="6" fill="none" stroke="#5B8B6A" stroke-width="1.5"/>
  <text x="710" y="215" text-anchor="middle" class="concept">文法体系への定着</text>
  <text x="710" y="235" text-anchor="middle" class="concept">音韻体系の定着</text>
  <text x="710" y="255" text-anchor="middle" class="concept">構文ネットワーク</text>

  <!-- Strength legend -->
  <rect x="48" y="310" width="712" height="1" fill="#E0DDD8"/>
  <text x="60" y="338" class="summary-title">対応の強さ</text>
  <line x1="150" y1="334" x2="190" y2="334" stroke="#2C2C2C" stroke-width="2"/>
  <text x="198" y="338" class="summary-text">強い対応</text>
  <line x1="280" y1="334" x2="320" y2="334" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="328" y="338" class="summary-text">部分的対応</text>
  <line x1="430" y1="334" x2="470" y2="334" stroke="#D0D0D0" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="478" y="338" class="summary-text">弱い対応</text>

  <!-- Summary -->
  <rect x="48" y="358" width="712" height="185" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="68" y="382" class="summary-title">全体の対応評価サマリ</text>

  <text x="68" y="408" class="summary-text">対応度: 全体として強い（10理論中6理論が強い対応）</text>

  <text x="68" y="432" class="summary-text">強い対応: 文法化、音変化の拡散、ニカラグア手話、構文の創発、最適性理論、反復的学習モデル</text>

  <text x="68" y="456" class="summary-text">特徴1: 「意図なき創造」— 話者の明示的意図なしに文法構造が自発的に創発（渦の具体化）</text>

  <text x="68" y="480" class="summary-text">特徴2: 多スケール同型性 — 個人獲得・共同体変化・歴史変遷で同型の5段階が反復</text>

  <text x="68" y="504" class="summary-text">特徴3: 「縁」の多様な実装 — 社会ネットワーク伝播、制約間競合、伝達ボトルネック等</text>

  <text x="68" y="528" class="summary-text">特徴4: ニカラグア手話は5段階全プロセスを実時間で観察できる最も直接的な事例</text>
</svg>
