<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowD30" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <style>
      .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
      .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #FAFAF8; font-weight: bold; }
      .stage-sub { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #FAFAF8; }
      .concept { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .ref { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
      .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
      .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .legend { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" class="title">D30 伝統知 — 5段階モデルとの構造対応図</text>

  <!-- Stage boxes -->
  <!-- Field -->
  <rect x="50" y="100" width="120" height="70" rx="8" fill="#8B8682"/>
  <text x="110" y="128" text-anchor="middle" class="stage-label">場（Field）</text>
  <text x="110" y="148" text-anchor="middle" class="stage-sub">社会-生態系の前提</text>

  <!-- Wave -->
  <rect x="200" y="100" width="120" height="70" rx="8" fill="#5B8DB8"/>
  <text x="260" y="128" text-anchor="middle" class="stage-label">波（Wave）</text>
  <text x="260" y="148" text-anchor="middle" class="stage-sub">環境変動・技能摩擦</text>

  <!-- Edge -->
  <rect x="350" y="100" width="120" height="70" rx="8" fill="#D4A857"/>
  <text x="410" y="128" text-anchor="middle" class="stage-label">縁（Edge）</text>
  <text x="410" y="148" text-anchor="middle" class="stage-sub">あいだの生成</text>

  <!-- Vortex -->
  <rect x="500" y="100" width="120" height="70" rx="8" fill="#C45B4D"/>
  <text x="560" y="128" text-anchor="middle" class="stage-label">渦（Vortex）</text>
  <text x="560" y="148" text-anchor="middle" class="stage-sub">暗黙知の体得</text>

  <!-- Bundle -->
  <rect x="650" y="100" width="120" height="70" rx="8" fill="#5B8B6A"/>
  <text x="710" y="128" text-anchor="middle" class="stage-label">束（Bundle）</text>
  <text x="710" y="148" text-anchor="middle" class="stage-sub">動的伝承体系</text>

  <!-- Arrows between stages -->
  <line x1="170" y1="135" x2="198" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD30)"/>
  <line x1="320" y1="135" x2="348" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD30)"/>
  <line x1="470" y1="135" x2="498" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD30)"/>
  <line x1="620" y1="135" x2="648" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD30)"/>

  <!-- Concepts under each stage -->
  <!-- Field concepts -->
  <line x1="110" y1="170" x2="110" y2="195" stroke="#8B8682" stroke-width="2"/>
  <rect x="45" y="195" width="130" height="110" rx="6" fill="none" stroke="#8B8682" stroke-width="1.5"/>
  <text x="110" y="215" text-anchor="middle" class="concept">社会-生態系の前提</text>
  <text x="110" y="233" text-anchor="middle" class="concept">TEKの知識基盤</text>
  <text x="110" y="251" text-anchor="middle" class="concept">里山の定常管理状態</text>
  <text x="110" y="272" text-anchor="middle" class="ref">(Berkes/Takeuchi)</text>

  <!-- Wave concepts -->
  <line x1="260" y1="170" x2="260" y2="195" stroke="#5B8DB8" stroke-width="2"/>
  <rect x="195" y="195" width="130" height="110" rx="6" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
  <text x="260" y="215" text-anchor="middle" class="concept">環境変動</text>
  <text x="260" y="233" text-anchor="middle" class="concept">技能の未熟さ</text>
  <text x="260" y="251" text-anchor="middle" class="concept">型との齟齬</text>
  <text x="260" y="272" text-anchor="middle" class="ref">(守破離/生田)</text>

  <!-- Edge concepts -->
  <line x1="410" y1="170" x2="410" y2="195" stroke="#D4A857" stroke-width="2"/>
  <rect x="345" y="195" width="130" height="110" rx="6" fill="none" stroke="#D4A857" stroke-width="1.5"/>
  <text x="410" y="215" text-anchor="middle" class="concept">一座建立の「間」</text>
  <text x="410" y="233" text-anchor="middle" class="concept">LPPの周辺参加</text>
  <text x="410" y="251" text-anchor="middle" class="concept">里山のedge effect</text>
  <text x="410" y="272" text-anchor="middle" class="ref">(沈黙が縁を構成)</text>

  <!-- Vortex concepts -->
  <line x1="560" y1="170" x2="560" y2="195" stroke="#C45B4D" stroke-width="2"/>
  <rect x="495" y="195" width="130" height="110" rx="6" fill="none" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="560" y="215" text-anchor="middle" class="concept">暗黙知の体得</text>
  <text x="560" y="233" text-anchor="middle" class="concept">杜氏のわざ発現</text>
  <text x="560" y="251" text-anchor="middle" class="concept">メーティスの結晶化</text>
  <text x="560" y="272" text-anchor="middle" class="ref">(Scott/旭酒造)</text>

  <!-- Bundle concepts -->
  <line x1="710" y1="170" x2="710" y2="195" stroke="#5B8B6A" stroke-width="2"/>
  <rect x="645" y="195" width="130" height="110" rx="6" fill="none" stroke="#5B8B6A" stroke-width="1.5"/>
  <text x="710" y="215" text-anchor="middle" class="concept">制度・伝承体系</text>
  <text x="710" y="233" text-anchor="middle" class="concept">口承の動的更新</text>
  <text x="710" y="251" text-anchor="middle" class="concept">年次祭礼サイクル</text>
  <text x="710" y="272" text-anchor="middle" class="ref">(Ong/Vansina/本田)</text>

  <!-- Legend -->
  <rect x="40" y="325" width="720" height="90" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="348" class="summary-title">対応の強さ</text>
  <line x1="60" y1="365" x2="100" y2="365" stroke="#2C2C2C" stroke-width="2"/>
  <text x="108" y="370" class="summary-text">強い対応</text>
  <line x1="240" y1="365" x2="280" y2="365" stroke="#2C2C2C" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="288" y="370" class="summary-text">部分的対応</text>
  <line x1="420" y1="365" x2="460" y2="365" stroke="#D0D0D0" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="468" y="370" class="legend">弱い対応</text>
  <text x="60" y="393" class="summary-text">強い対応4件: TEK, 一座建立, 杜氏の技能伝承, 里山ランドスケープ</text>
  <text x="60" y="408" class="legend">条件付き: 民俗芸能の伝承（文献的裏付け不足）</text>

  <!-- Summary -->
  <rect x="40" y="430" width="720" height="140" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="453" class="summary-title">全体評価サマリ</text>
  <text x="60" y="473" class="summary-text">10理論中9件で構造対応。「反復の中にある生成」が基本構造。</text>
  <text x="60" y="491" class="summary-text">束は固定的到達点でなく環境FBに開かれた動的構造。束の動態性を最も鮮明に示す。</text>
  <text x="60" y="509" class="summary-text">縁は個人の内部でなく「あいだ」に成立: 人-人、人-素材、人-環境。</text>
  <text x="60" y="527" class="summary-text">縁の類型: 沈黙/関係型 — 「沈黙が縁を構成する」。正統性が縁の成立条件。</text>
  <text x="60" y="545" class="summary-text">再循環テーマと強く接続: TEK/口承/守破離の全てで束→場の螺旋を確認。</text>
</svg>
