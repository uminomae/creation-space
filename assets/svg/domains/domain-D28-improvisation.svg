<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowD28" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <style>
      .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
      .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #FAFAF8; font-weight: bold; }
      .stage-sub { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #FAFAF8; }
      .concept { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .ref { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #666666; }
      .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
      .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
      .legend { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" class="title">D28 舞台芸術 — 5段階モデルとの構造対応図</text>

  <!-- Stage boxes -->
  <!-- Field -->
  <rect x="50" y="100" width="120" height="70" rx="8" fill="#8B8682"/>
  <text x="110" y="128" text-anchor="middle" class="stage-label">場（Field）</text>
  <text x="110" y="148" text-anchor="middle" class="stage-sub">稽古場の空間</text>

  <!-- Wave -->
  <rect x="200" y="100" width="120" height="70" rx="8" fill="#5B8DB8"/>
  <text x="260" y="128" text-anchor="middle" class="stage-label">波（Wave）</text>
  <text x="260" y="148" text-anchor="middle" class="stage-sub">提案と応答</text>

  <!-- Edge -->
  <rect x="350" y="100" width="120" height="70" rx="8" fill="#D4A857"/>
  <text x="410" y="128" text-anchor="middle" class="stage-label">縁（Edge）</text>
  <text x="410" y="148" text-anchor="middle" class="stage-sub">Yes and...</text>

  <!-- Vortex -->
  <rect x="500" y="100" width="120" height="70" rx="8" fill="#C45B4D"/>
  <text x="560" y="128" text-anchor="middle" class="stage-label">渦（Vortex）</text>
  <text x="560" y="148" text-anchor="middle" class="stage-sub">「花」の生起</text>

  <!-- Bundle -->
  <rect x="650" y="100" width="120" height="70" rx="8" fill="#5B8B6A"/>
  <text x="710" y="128" text-anchor="middle" class="stage-label">束（Bundle）</text>
  <text x="710" y="148" text-anchor="middle" class="stage-sub">伝書体系</text>

  <!-- Arrows between stages -->
  <line x1="170" y1="135" x2="198" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD28)"/>
  <line x1="320" y1="135" x2="348" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD28)"/>
  <line x1="470" y1="135" x2="498" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD28)"/>
  <line x1="620" y1="135" x2="648" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD28)"/>

  <!-- Concepts under each stage -->
  <!-- Field concepts -->
  <line x1="110" y1="170" x2="110" y2="195" stroke="#8B8682" stroke-width="2"/>
  <rect x="45" y="195" width="130" height="110" rx="6" fill="none" stroke="#8B8682" stroke-width="1.5"/>
  <text x="110" y="215" text-anchor="middle" class="concept">ソフト・フォーカス</text>
  <text x="110" y="233" text-anchor="middle" class="concept">稽古場の空間</text>
  <text x="110" y="251" text-anchor="middle" class="concept">Grotowskiの「貧」</text>
  <text x="110" y="273" text-anchor="middle" class="ref">(Viewpoints/Grotowski)</text>

  <!-- Wave concepts -->
  <line x1="260" y1="170" x2="260" y2="195" stroke="#5B8DB8" stroke-width="2"/>
  <rect x="195" y="195" width="130" height="110" rx="6" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
  <text x="260" y="215" text-anchor="middle" class="concept">提案と応答</text>
  <text x="260" y="233" text-anchor="middle" class="concept">身体的差異の探索</text>
  <text x="260" y="251" text-anchor="middle" class="concept">社会的境界の揺れ</text>
  <text x="260" y="273" text-anchor="middle" class="ref">(Spolin/Boal)</text>

  <!-- Edge concepts -->
  <line x1="410" y1="170" x2="410" y2="195" stroke="#D4A857" stroke-width="2.5"/>
  <rect x="345" y="195" width="130" height="110" rx="6" fill="none" stroke="#D4A857" stroke-width="2.5"/>
  <text x="410" y="215" text-anchor="middle" class="concept">Yes and...</text>
  <text x="410" y="233" text-anchor="middle" class="concept">秘すれば花</text>
  <text x="410" y="251" text-anchor="middle" class="concept">FBループの生成</text>
  <text x="410" y="273" text-anchor="middle" class="ref">(3条件を一語で実践)</text>

  <!-- Vortex concepts -->
  <line x1="560" y1="170" x2="560" y2="195" stroke="#C45B4D" stroke-width="2"/>
  <rect x="495" y="195" width="130" height="110" rx="6" fill="none" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="560" y="215" text-anchor="middle" class="concept">「花」の関係的生起</text>
  <text x="560" y="233" text-anchor="middle" class="concept">自己生成的転換</text>
  <text x="560" y="251" text-anchor="middle" class="concept">autopoietic FB loop</text>
  <text x="560" y="273" text-anchor="middle" class="ref">(世阿弥/Fischer-Lichte)</text>

  <!-- Bundle concepts -->
  <line x1="710" y1="170" x2="710" y2="195" stroke="#5B8B6A" stroke-width="2"/>
  <rect x="645" y="195" width="130" height="110" rx="6" fill="none" stroke="#5B8B6A" stroke-width="1.5"/>
  <text x="710" y="215" text-anchor="middle" class="concept">伝書体系</text>
  <text x="710" y="233" text-anchor="middle" class="concept">教育メソッド</text>
  <text x="710" y="251" text-anchor="middle" class="concept">演劇フォーマット</text>
  <text x="710" y="273" text-anchor="middle" class="ref">(Stanislavski/Boal)</text>

  <!-- Legend -->
  <rect x="40" y="325" width="720" height="90" rx="8" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="348" class="summary-title">対応の強さ</text>
  <line x1="60" y1="368" x2="100" y2="368" stroke="#2C2C2C" stroke-width="2"/>
  <text x="108" y="372" class="summary-text">強い対応</text>
  <line x1="240" y1="368" x2="280" y2="368" stroke="#2C2C2C" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="288" y="372" class="summary-text">部分的対応</text>
  <line x1="440" y1="368" x2="480" y2="368" stroke="#D0D0D0" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="488" y="372" class="summary-text">弱い対応</text>
  <text x="60" y="395" class="summary-text">確定に近い: 世阿弥花伝書, 即興演劇(Johnstone/Spolin), Fischer-Lichte, Viewpoints</text>
  <text x="60" y="409" class="legend">条件付き: Laban身体動作分析, Schechnerパフォーマンス研究</text>

  <!-- Summary -->
  <rect x="40" y="430" width="720" height="145" rx="8" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="453" class="summary-title">全体評価サマリ</text>
  <text x="60" y="475" class="summary-text">全体として有力な領域。「縁→渦」移行が直接観察可能な形で記述される。</text>
  <text x="60" y="493" class="summary-text">「縁」を最も多層的に記述: 身体的関係/演者-観客FB/形式と内的プロセス/社会的境界。</text>
  <text x="60" y="511" class="summary-text">「渦」は計画で到達不可。縁の条件が整ったとき自発的に出現するものとして記述。</text>
  <text x="60" y="529" class="summary-text">縁の類型: 操作的定義型 — 「Yes and...」が縁の3条件を一語で同時実践する。</text>
  <text x="60" y="547" class="summary-text">ブロック(即興の停止)は「渦不到達経路」として盲点テーマと接続。</text>
</svg>
