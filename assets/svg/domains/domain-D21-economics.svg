<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowD21" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <style>
      .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
      .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #FAFAF8; font-weight: bold; }
      .concept { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
      .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
      .stage-sub { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #FAFAF8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" class="title">D21 経済学 — 5段階モデルとの構造対応図</text>

  <!-- Stage boxes -->
  <!-- Field -->
  <rect x="45" y="100" width="120" height="70" rx="10" fill="#8B8682"/>
  <text x="105" y="128" text-anchor="middle" class="stage-label">場（Field）</text>
  <text x="105" y="148" text-anchor="middle" class="stage-sub">均衡と不確実性の背景</text>

  <!-- Wave -->
  <rect x="195" y="100" width="120" height="70" rx="10" fill="#5B8DB8"/>
  <text x="255" y="128" text-anchor="middle" class="stage-label">波（Wave）</text>
  <text x="255" y="148" text-anchor="middle" class="stage-sub">揺らぎと新結合</text>

  <!-- Edge -->
  <rect x="345" y="100" width="120" height="70" rx="10" fill="#D4A857"/>
  <text x="405" y="128" text-anchor="middle" class="stage-label">縁（Edge）</text>
  <text x="405" y="148" text-anchor="middle" class="stage-sub">分岐と判断の臨界</text>

  <!-- Vortex -->
  <rect x="495" y="100" width="120" height="70" rx="10" fill="#C45B4D"/>
  <text x="555" y="128" text-anchor="middle" class="stage-label">渦（Vortex）</text>
  <text x="555" y="148" text-anchor="middle" class="stage-sub">自己強化ダイナミクス</text>

  <!-- Bundle -->
  <rect x="645" y="100" width="120" height="70" rx="10" fill="#5B8B6A"/>
  <text x="705" y="128" text-anchor="middle" class="stage-label">束（Bundle）</text>
  <text x="705" y="148" text-anchor="middle" class="stage-sub">制度と秩序の定着</text>

  <!-- Arrows between stages -->
  <line x1="165" y1="135" x2="193" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD21)"/>
  <line x1="315" y1="135" x2="343" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD21)"/>
  <line x1="465" y1="135" x2="493" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD21)"/>
  <line x1="615" y1="135" x2="643" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD21)"/>

  <!-- Concepts under each stage -->
  <!-- Field concepts -->
  <line x1="105" y1="170" x2="105" y2="195" stroke="#8B8682" stroke-width="2"/>
  <rect x="40" y="195" width="130" height="90" rx="6" fill="none" stroke="#8B8682" stroke-width="1.5"/>
  <text x="105" y="215" text-anchor="middle" class="concept">複数均衡の潜在空間</text>
  <text x="105" y="235" text-anchor="middle" class="concept">円環的流れ・定常状態</text>
  <text x="105" y="255" text-anchor="middle" class="concept">根本的不確実性</text>

  <!-- Wave concepts -->
  <line x1="255" y1="170" x2="255" y2="195" stroke="#5B8DB8" stroke-width="2"/>
  <rect x="190" y="195" width="130" height="90" rx="6" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
  <text x="255" y="215" text-anchor="middle" class="concept">小さな揺らぎ・偶発的事象</text>
  <text x="255" y="235" text-anchor="middle" class="concept">企業家の参入・新結合</text>
  <text x="255" y="255" text-anchor="middle" class="concept">安定が生む楽観の拡大</text>

  <!-- Edge concepts -->
  <line x1="405" y1="170" x2="405" y2="195" stroke="#D4A857" stroke-width="2"/>
  <rect x="340" y="195" width="130" height="90" rx="6" fill="none" stroke="#D4A857" stroke-width="1.5"/>
  <text x="405" y="215" text-anchor="middle" class="concept">ティッピングポイント</text>
  <text x="405" y="235" text-anchor="middle" class="concept">不確実性の引受判断</text>
  <text x="405" y="255" text-anchor="middle" class="concept">ミンスキー・モーメント</text>

  <!-- Vortex concepts -->
  <line x1="555" y1="170" x2="555" y2="195" stroke="#C45B4D" stroke-width="2"/>
  <rect x="490" y="195" width="130" height="90" rx="6" fill="none" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="555" y="215" text-anchor="middle" class="concept">収穫逓増の自己強化</text>
  <text x="555" y="235" text-anchor="middle" class="concept">イノベーションの群生</text>
  <text x="555" y="255" text-anchor="middle" class="concept">信用収縮の連鎖</text>

  <!-- Bundle concepts -->
  <line x1="705" y1="170" x2="705" y2="195" stroke="#5B8B6A" stroke-width="2"/>
  <rect x="640" y="195" width="130" height="90" rx="6" fill="none" stroke="#5B8B6A" stroke-width="1.5"/>
  <text x="705" y="215" text-anchor="middle" class="concept">技術的ロックイン</text>
  <text x="705" y="235" text-anchor="middle" class="concept">自生的秩序・制度</text>
  <text x="705" y="255" text-anchor="middle" class="concept">危機後の規制・新秩序</text>

  <!-- Correspondence strength indicators -->
  <text x="400" y="325" text-anchor="middle" class="summary-title">対応の強さ（理論別）</text>

  <!-- Strong correspondence -->
  <line x1="60" y1="348" x2="100" y2="348" stroke="#2C2C2C" stroke-width="2"/>
  <text x="108" y="352" class="summary-text">強い対応</text>

  <line x1="240" y1="348" x2="280" y2="348" stroke="#2C2C2C" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="288" y="352" class="summary-text">部分的対応</text>

  <line x1="440" y1="348" x2="480" y2="348" stroke="#D0D0D0" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="488" y="352" class="summary-text">弱い対応</text>

  <!-- Summary -->
  <rect x="45" y="370" width="710" height="185" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>

  <text x="60" y="395" class="summary-title">全体の対応評価サマリ</text>

  <text x="60" y="420" class="summary-text">対応度: 全体として高い（10理論全てに強いまたは部分的な対応を確認）</text>

  <text x="60" y="444" class="summary-text">確定に近い: Arthur複雑系経済学（全5段階）、Minsky金融不安定性仮説（全5段階）</text>

  <text x="60" y="468" class="summary-text">特徴1: 不確実性下の分岐と自己強化ダイナミクスが中盤～後半で厚い対応を示す</text>

  <text x="60" y="492" class="summary-text">特徴2: 渦の方向が二極 — 創造的自己強化(Schumpeter)と破壊的自己強化(Minsky)が同型構造</text>

  <text x="60" y="516" class="summary-text">特徴3: Knightのリスク/不確実性区分が「縁」の構造を原理的に記述 — 処理可能/不能の境界</text>

  <text x="60" y="540" class="summary-text">部分的対応: North制度経済学、Senケイパビリティ、Penrose企業成長（特定段階に偏重）</text>
</svg>
