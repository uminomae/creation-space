<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowD24" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <style>
      .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
      .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #FAFAF8; font-weight: bold; }
      .stage-sub { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #FAFAF8; }
      .concept { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .ref { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #666666; }
      .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
      .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
      .legend { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" class="title">D24 宗教学・神秘主義 — 5段階モデルとの構造対応図</text>

  <!-- Stage boxes -->
  <!-- Field -->
  <rect x="50" y="90" width="120" height="70" rx="8" fill="#8B8682"/>
  <text x="110" y="122" text-anchor="middle" class="stage-label">場（Field）</text>
  <text x="110" y="148" text-anchor="middle" class="stage-sub">Field</text>

  <!-- Wave -->
  <rect x="200" y="90" width="120" height="70" rx="8" fill="#5B8DB8"/>
  <text x="260" y="122" text-anchor="middle" class="stage-label">波（Wave）</text>
  <text x="260" y="148" text-anchor="middle" class="stage-sub">Wave</text>

  <!-- Edge -->
  <rect x="350" y="90" width="120" height="70" rx="8" fill="#D4A857"/>
  <text x="410" y="122" text-anchor="middle" class="stage-label">縁（Edge）</text>
  <text x="410" y="148" text-anchor="middle" class="stage-sub">Edge</text>

  <!-- Vortex -->
  <rect x="500" y="90" width="120" height="70" rx="8" fill="#C45B4D"/>
  <text x="560" y="122" text-anchor="middle" class="stage-label">渦（Vortex）</text>
  <text x="560" y="148" text-anchor="middle" class="stage-sub">Vortex</text>

  <!-- Bundle -->
  <rect x="650" y="90" width="120" height="70" rx="8" fill="#5B8B6A"/>
  <text x="710" y="122" text-anchor="middle" class="stage-label">束（Bundle）</text>
  <text x="710" y="148" text-anchor="middle" class="stage-sub">Bundle</text>

  <!-- Arrows between stages -->
  <line x1="170" y1="125" x2="198" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD24)"/>
  <line x1="320" y1="125" x2="348" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD24)"/>
  <line x1="470" y1="125" x2="498" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD24)"/>
  <line x1="620" y1="125" x2="648" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD24)"/>

  <!-- Concepts under each stage -->
  <!-- Field concepts -->
  <line x1="110" y1="160" x2="110" y2="185" stroke="#8B8682" stroke-width="2"/>
  <rect x="45" y="185" width="130" height="110" rx="6" fill="none" stroke="#8B8682" stroke-width="1.5"/>
  <text x="110" y="205" text-anchor="middle" class="concept">俗なる均質空間</text>
  <text x="110" y="225" text-anchor="middle" class="concept">動的力場(文脈)</text>
  <text x="110" y="245" text-anchor="middle" class="concept">ナフスの自然状態</text>
  <text x="110" y="270" text-anchor="middle" class="ref">(Eliade/Rambo/Sufi)</text>

  <!-- Wave concepts -->
  <line x1="260" y1="160" x2="260" y2="185" stroke="#5B8DB8" stroke-width="2"/>
  <rect x="195" y="185" width="130" height="110" rx="6" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
  <text x="260" y="205" text-anchor="middle" class="concept">危機・悔悟</text>
  <text x="260" y="225" text-anchor="middle" class="concept">試練と闘争</text>
  <text x="260" y="245" text-anchor="middle" class="concept">尋牛・見跡</text>
  <text x="260" y="270" text-anchor="middle" class="ref">(Rambo/Teresa/十牛図)</text>

  <!-- Edge concepts -->
  <line x1="410" y1="160" x2="410" y2="185" stroke="#D4A857" stroke-width="2"/>
  <rect x="345" y="185" width="130" height="110" rx="6" fill="none" stroke="#D4A857" stroke-width="1.5"/>
  <text x="410" y="205" text-anchor="middle" class="concept">努力と恩寵の交錯</text>
  <text x="410" y="225" text-anchor="middle" class="concept">加行道の四加行</text>
  <text x="410" y="245" text-anchor="middle" class="concept">能動→受動の転換</text>
  <text x="410" y="270" text-anchor="middle" class="ref">(Teresa/菩薩五道/Sufi)</text>

  <!-- Vortex concepts -->
  <line x1="560" y1="160" x2="560" y2="185" stroke="#C45B4D" stroke-width="2"/>
  <rect x="495" y="185" width="130" height="110" rx="6" fill="none" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="560" y="205" text-anchor="middle" class="concept">空性の直接体験</text>
  <text x="560" y="225" text-anchor="middle" class="concept">ファナー(自我消滅)</text>
  <text x="560" y="245" text-anchor="middle" class="concept">人牛俱忘</text>
  <text x="560" y="270" text-anchor="middle" class="ref">(菩薩見道/Sufi/十牛図)</text>

  <!-- Bundle concepts -->
  <line x1="710" y1="160" x2="710" y2="185" stroke="#5B8B6A" stroke-width="2"/>
  <rect x="645" y="185" width="130" height="110" rx="6" fill="none" stroke="#5B8B6A" stroke-width="1.5"/>
  <text x="710" y="205" text-anchor="middle" class="concept">霊的結婚(持続型)</text>
  <text x="710" y="225" text-anchor="middle" class="concept">バカー(存続)</text>
  <text x="710" y="245" text-anchor="middle" class="concept">入鄽垂手(循環型)</text>
  <text x="710" y="270" text-anchor="middle" class="ref">(Teresa/Sufi/十牛図)</text>

  <!-- Legend -->
  <rect x="45" y="315" width="710" height="95" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="338" class="summary-title">対応の強さ</text>
  <line x1="60" y1="358" x2="100" y2="358" stroke="#2C2C2C" stroke-width="2"/>
  <text x="108" y="362" class="legend">強い対応</text>
  <line x1="240" y1="358" x2="280" y2="358" stroke="#2C2C2C" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="288" y="362" class="legend">部分的対応</text>
  <line x1="440" y1="358" x2="480" y2="358" stroke="#D0D0D0" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="488" y="362" class="legend">条件付き対応</text>
  <text x="60" y="385" class="concept">強い対応6件: Rambo, Eliade, 十牛図, 菩薩十地・五道, Fana/Baqa, Maqamat</text>
  <text x="60" y="400" class="legend">部分的3件: Teresa, Turner, 錬金術 / 条件付き1件: James</text>

  <!-- Summary -->
  <rect x="45" y="425" width="710" height="135" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="448" class="summary-title">全体評価サマリ</text>
  <text x="60" y="470" class="summary-text">10件中9件で構造対応確認。全体として高い対応を持つ領域。</text>
  <text x="60" y="490" class="summary-text">縁の最大特徴: 努力と恩寵の交錯（キリスト教・仏教・イスラーム横断）。</text>
  <text x="60" y="510" class="summary-text">束に二つの型: 持続型（霊的結婚/バカー）と循環型（永劫回帰/入鄽垂手）。</text>
  <text x="60" y="530" class="summary-text">段階数の多様性（7/10/100段階）にもかかわらず全体の流れは共有される。</text>
  <text x="60" y="550" class="summary-text">「空」の位置づけ（渦の極限か束→場の中間か）は未解決の問い。</text>
</svg>
