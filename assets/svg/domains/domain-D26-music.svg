<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowD26" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <style>
      .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
      .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #FAFAF8; font-weight: bold; }
      .stage-sub { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #FAFAF8; }
      .concept { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .ref { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #666666; }
      .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
      .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
      .legend { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" class="title">D26 音楽学 — 5段階モデルとの構造対応図</text>

  <!-- Stage boxes -->
  <!-- Field -->
  <rect x="50" y="90" width="120" height="70" rx="8" fill="#8B8682"/>
  <text x="110" y="118" text-anchor="middle" class="stage-label">場（Field）</text>
  <text x="110" y="148" text-anchor="middle" class="stage-sub">聴取者の期待体系</text>

  <!-- Wave -->
  <rect x="200" y="90" width="120" height="70" rx="8" fill="#5B8DB8"/>
  <text x="260" y="118" text-anchor="middle" class="stage-label">波（Wave）</text>
  <text x="260" y="148" text-anchor="middle" class="stage-sub">期待の阻害/遅延</text>

  <!-- Edge -->
  <rect x="350" y="90" width="120" height="70" rx="8" fill="#D4A857"/>
  <text x="410" y="118" text-anchor="middle" class="stage-label">縁（Edge）</text>
  <text x="410" y="148" text-anchor="middle" class="stage-sub">予測応答の界面</text>

  <!-- Vortex -->
  <rect x="500" y="90" width="120" height="70" rx="8" fill="#C45B4D"/>
  <text x="560" y="118" text-anchor="middle" class="stage-label">渦（Vortex）</text>
  <text x="560" y="148" text-anchor="middle" class="stage-sub">解決の収斂</text>

  <!-- Bundle -->
  <rect x="650" y="90" width="120" height="70" rx="8" fill="#5B8B6A"/>
  <text x="710" y="118" text-anchor="middle" class="stage-label">束（Bundle）</text>
  <text x="710" y="148" text-anchor="middle" class="stage-sub">様式の定着</text>

  <!-- Arrows between stages -->
  <line x1="170" y1="125" x2="198" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD26)"/>
  <line x1="320" y1="125" x2="348" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD26)"/>
  <line x1="470" y1="125" x2="498" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD26)"/>
  <line x1="620" y1="125" x2="648" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD26)"/>

  <!-- Concepts under each stage -->
  <!-- Field concepts -->
  <line x1="110" y1="160" x2="110" y2="185" stroke="#8B8682" stroke-width="2"/>
  <rect x="45" y="185" width="130" height="100" rx="6" fill="none" stroke="#8B8682" stroke-width="1.5"/>
  <text x="110" y="205" text-anchor="middle" class="concept">聴取者の期待体系</text>
  <text x="110" y="223" text-anchor="middle" class="concept">音響的環境</text>
  <text x="110" y="241" text-anchor="middle" class="concept">スタイル規範</text>
  <text x="110" y="275" text-anchor="middle" class="ref">(Meyer/Huron)</text>

  <!-- Wave concepts -->
  <line x1="260" y1="160" x2="260" y2="185" stroke="#5B8DB8" stroke-width="2"/>
  <rect x="195" y="185" width="130" height="100" rx="6" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
  <text x="260" y="205" text-anchor="middle" class="concept">期待の阻害/遅延</text>
  <text x="260" y="223" text-anchor="middle" class="concept">転調・逸脱</text>
  <text x="260" y="241" text-anchor="middle" class="concept">リズムの偏差</text>
  <text x="260" y="275" text-anchor="middle" class="ref">(Pressing/Witek)</text>

  <!-- Edge concepts -->
  <line x1="410" y1="160" x2="410" y2="185" stroke="#D4A857" stroke-width="2"/>
  <rect x="345" y="185" width="130" height="100" rx="6" fill="none" stroke="#D4A857" stroke-width="1.5"/>
  <text x="410" y="205" text-anchor="middle" class="concept">サスペンス</text>
  <text x="410" y="223" text-anchor="middle" class="concept">グルーヴ逆U字</text>
  <text x="410" y="241" text-anchor="middle" class="concept">予測応答の並立</text>
  <text x="410" y="275" text-anchor="middle" class="ref">(Meyer/Huron)</text>

  <!-- Vortex concepts -->
  <line x1="560" y1="160" x2="560" y2="185" stroke="#C45B4D" stroke-width="2"/>
  <rect x="495" y="185" width="130" height="100" rx="6" fill="none" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="560" y="205" text-anchor="middle" class="concept">解決の瞬間</text>
  <text x="560" y="223" text-anchor="middle" class="concept">即興の収斂</text>
  <text x="560" y="241" text-anchor="middle" class="concept">聴覚的統合</text>
  <text x="560" y="275" text-anchor="middle" class="ref">(Bregman/Pressing)</text>

  <!-- Bundle concepts -->
  <line x1="710" y1="160" x2="710" y2="185" stroke="#5B8B6A" stroke-width="2"/>
  <rect x="645" y="185" width="130" height="100" rx="6" fill="none" stroke="#5B8B6A" stroke-width="1.5"/>
  <text x="710" y="205" text-anchor="middle" class="concept">様式・形式の定着</text>
  <text x="710" y="223" text-anchor="middle" class="concept">ラーガの体系</text>
  <text x="710" y="241" text-anchor="middle" class="concept">文化的伝承</text>
  <text x="710" y="275" text-anchor="middle" class="ref">(NHS/Savage)</text>

  <!-- Legend -->
  <rect x="45" y="310" width="710" height="105" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="400" y="330" text-anchor="middle" class="summary-title">対応の強さ（理論別）</text>

  <line x1="60" y1="353" x2="100" y2="353" stroke="#2C2C2C" stroke-width="2"/>
  <text x="108" y="357" class="summary-text">強い対応</text>

  <line x1="240" y1="353" x2="280" y2="353" stroke="#2C2C2C" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="288" y="357" class="summary-text">部分的対応</text>

  <line x1="440" y1="353" x2="480" y2="353" stroke="#D0D0D0" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="488" y="357" class="summary-text">条件付き対応</text>

  <text x="60" y="385" class="legend">確定に近い: Meyer期待理論、Huron ITPRA理論</text>
  <text x="60" y="403" class="legend">有力: Pressing即興モデル、ソナタ形式、グルーヴ理論、聴覚景分析、歌の普遍性研究</text>

  <!-- Summary -->
  <rect x="45" y="430" width="710" height="135" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="455" class="summary-title">全体評価サマリ</text>
  <text x="60" y="477" class="summary-text">10理論中7件で強い構造対応、3件で条件付き対応。対応なしの理論はゼロ。</text>
  <text x="60" y="497" class="summary-text">「縁」が多水準で確認される: サスペンス、最適偏差ゾーン、展開部の転調、知覚的双安定。</text>
  <text x="60" y="517" class="summary-text">「期待→偏差→再評価」がミリ秒から世紀まで再帰的に出現する点が固有の強み。</text>
  <text x="60" y="537" class="summary-text">縁の類型: 可能性空間型（予測誤差の時間芸術的保持、身体的エントレインメント）。</text>
</svg>
