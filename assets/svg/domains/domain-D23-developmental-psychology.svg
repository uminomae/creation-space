<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowD23" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <style>
      .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
      .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #FAFAF8; font-weight: bold; }
      .stage-sub { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #FAFAF8; }
      .concept { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
      .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
      .legend { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" class="title">D23 発達心理学 — 5段階モデルとの構造対応図</text>

  <!-- Stage boxes -->
  <!-- Field / 場 -->
  <rect x="50" y="100" width="120" height="70" rx="8" fill="#8B8682"/>
  <text x="110" y="128" text-anchor="middle" class="stage-label">場</text>
  <text x="110" y="148" text-anchor="middle" class="stage-sub">Field</text>

  <!-- Wave / 波 -->
  <rect x="200" y="100" width="120" height="70" rx="8" fill="#5B8DB8"/>
  <text x="260" y="128" text-anchor="middle" class="stage-label">波</text>
  <text x="260" y="148" text-anchor="middle" class="stage-sub">Wave</text>

  <!-- Edge / 縁 -->
  <rect x="350" y="100" width="120" height="70" rx="8" fill="#D4A857"/>
  <text x="410" y="128" text-anchor="middle" class="stage-label">縁</text>
  <text x="410" y="148" text-anchor="middle" class="stage-sub">Edge</text>

  <!-- Vortex / 渦 -->
  <rect x="500" y="100" width="120" height="70" rx="8" fill="#C45B4D"/>
  <text x="560" y="128" text-anchor="middle" class="stage-label">渦</text>
  <text x="560" y="148" text-anchor="middle" class="stage-sub">Vortex</text>

  <!-- Bundle / 束 -->
  <rect x="650" y="100" width="120" height="70" rx="8" fill="#5B8B6A"/>
  <text x="710" y="128" text-anchor="middle" class="stage-label">束</text>
  <text x="710" y="148" text-anchor="middle" class="stage-sub">Bundle</text>

  <!-- Arrows between stages -->
  <line x1="170" y1="135" x2="198" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD23)"/>
  <line x1="320" y1="135" x2="348" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD23)"/>
  <line x1="470" y1="135" x2="498" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD23)"/>
  <line x1="620" y1="135" x2="648" y2="135" stroke="#666666" stroke-width="2" marker-end="url(#arrowD23)"/>

  <!-- Ba concepts (dashed border — 部分的対応) -->
  <line x1="110" y1="170" x2="110" y2="195" stroke="#8B8682" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="40" y="195" width="140" height="110" rx="6" fill="none" stroke="#8B8682" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="110" y="215" text-anchor="middle" class="concept">安全基地</text>
  <text x="110" y="235" text-anchor="middle" class="concept">支援条件の前提</text>
  <text x="110" y="255" text-anchor="middle" class="concept">相互作用場</text>
  <text x="110" y="278" text-anchor="middle" class="legend">(Bowlby/Thelen)</text>

  <!-- Nami concepts -->
  <line x1="260" y1="170" x2="260" y2="195" stroke="#5B8DB8" stroke-width="2"/>
  <rect x="190" y="195" width="140" height="110" rx="6" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
  <text x="260" y="215" text-anchor="middle" class="concept">不安定化・揺れ</text>
  <text x="260" y="235" text-anchor="middle" class="concept">既存構造の葛藤</text>
  <text x="260" y="255" text-anchor="middle" class="concept">技能変動の増大</text>
  <text x="260" y="278" text-anchor="middle" class="legend">(Thelen/Fischer)</text>

  <!-- En concepts -->
  <line x1="410" y1="170" x2="410" y2="195" stroke="#D4A857" stroke-width="2"/>
  <rect x="340" y="195" width="140" height="110" rx="6" fill="none" stroke="#D4A857" stroke-width="1.5"/>
  <text x="410" y="215" text-anchor="middle" class="concept">共同注意・足場かけ</text>
  <text x="410" y="235" text-anchor="middle" class="concept">情動調律</text>
  <text x="410" y="255" text-anchor="middle" class="concept">三項関係の成立</text>
  <text x="410" y="278" text-anchor="middle" class="legend">(Vygotsky/Tomasello)</text>

  <!-- Uzu concepts -->
  <line x1="560" y1="170" x2="560" y2="195" stroke="#C45B4D" stroke-width="2"/>
  <rect x="490" y="195" width="140" height="110" rx="6" fill="none" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="560" y="215" text-anchor="middle" class="concept">自己基準の成立</text>
  <text x="560" y="235" text-anchor="middle" class="concept">新協調パターン</text>
  <text x="560" y="255" text-anchor="middle" class="concept">内面化の完了</text>
  <text x="560" y="278" text-anchor="middle" class="legend">(Kegan/Vygotsky)</text>

  <!-- Taba concepts -->
  <line x1="710" y1="170" x2="710" y2="195" stroke="#5B8B6A" stroke-width="2"/>
  <rect x="640" y="195" width="140" height="110" rx="6" fill="none" stroke="#5B8B6A" stroke-width="1.5"/>
  <text x="710" y="215" text-anchor="middle" class="concept">移送可能な構造</text>
  <text x="710" y="235" text-anchor="middle" class="concept">文化的慣行の外在化</text>
  <text x="710" y="255" text-anchor="middle" class="concept">技能の網の定着</text>
  <text x="710" y="278" text-anchor="middle" class="legend">(Fischer/Tomasello)</text>

  <!-- Legend -->
  <rect x="40" y="325" width="720" height="100" rx="8" fill="#FAFAF8" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="350" class="summary-title">対応の強さ</text>
  <line x1="60" y1="368" x2="100" y2="368" stroke="#2C2C2C" stroke-width="2"/>
  <text x="110" y="373" class="concept">強い対応</text>
  <line x1="240" y1="368" x2="280" y2="368" stroke="#2C2C2C" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="290" y="373" class="concept">部分的対応</text>
  <line x1="420" y1="368" x2="460" y2="368" stroke="#D0D0D0" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="470" y="373" class="summary-text">弱い対応</text>
  <text x="60" y="400" class="concept">確定に近い5件: Kegan, Thelen &amp; Smith, Vygotsky, Fischer, Tomasello</text>
  <text x="60" y="418" class="legend">条件つき: Piaget, Erikson, Kohlberg, Maslow（部分対応）/ AQAL（監査枠）</text>

  <!-- Summary -->
  <rect x="40" y="440" width="720" height="135" rx="8" fill="#FAFAF8" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="463" class="summary-title">全体評価サマリ</text>
  <text x="60" y="485" class="concept">15理論中5件が確定に近い対応。全体として有力な領域。</text>
  <text x="60" y="503" class="concept">縁→渦の厚さが最大の特徴: 関係の界面から新しいまとまりが立ち上がる。</text>
  <text x="60" y="521" class="concept">場は空白でなく配向を持つ前提（安全基地・支援条件）。</text>
  <text x="60" y="539" class="concept">束は安定でなく移送可能性: 別場面で再作動する構造として定義される。</text>
  <text x="60" y="557" class="concept">段階数の一致は指標にならず、移行の記述が濃い理論ほど対応が強い。</text>
</svg>
