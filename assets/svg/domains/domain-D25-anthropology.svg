<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowD25" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
    <style>
      .title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 24px; fill: #2C2C2C; font-weight: bold; }
      .stage-label { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #FAFAF8; font-weight: bold; }
      .stage-sub { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #FAFAF8; }
      .concept { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #2C2C2C; }
      .ref { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; fill: #666666; }
      .summary-title { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; fill: #2C2C2C; font-weight: bold; }
      .summary-text { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 12px; fill: #666666; }
      .legend { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAF8" rx="8"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#E0DDD8" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" class="title">D25 人類学 — 5段階モデルとの構造対応図</text>

  <!-- Stage boxes -->
  <!-- Field / 場 -->
  <rect x="50" y="90" width="120" height="70" rx="8" fill="#8B8682"/>
  <text x="110" y="118" text-anchor="middle" class="stage-label">場（Field）</text>
  <text x="110" y="148" text-anchor="middle" class="stage-sub">未加工・既存構造</text>

  <!-- Wave / 波 -->
  <rect x="200" y="90" width="120" height="70" rx="8" fill="#5B8DB8"/>
  <text x="260" y="118" text-anchor="middle" class="stage-label">波（Wave）</text>
  <text x="260" y="148" text-anchor="middle" class="stage-sub">規範の破れ・分離</text>

  <!-- Edge / 縁 -->
  <rect x="350" y="90" width="120" height="70" rx="8" fill="#D4A857"/>
  <text x="410" y="118" text-anchor="middle" class="stage-label">縁（Edge）</text>
  <text x="410" y="148" text-anchor="middle" class="stage-sub">リミナリティ</text>

  <!-- Vortex / 渦 -->
  <rect x="500" y="90" width="120" height="70" rx="8" fill="#C45B4D"/>
  <text x="560" y="118" text-anchor="middle" class="stage-label">渦（Vortex）</text>
  <text x="560" y="148" text-anchor="middle" class="stage-sub">コミュニタス</text>

  <!-- Bundle / 束 -->
  <rect x="650" y="90" width="120" height="70" rx="8" fill="#5B8B6A"/>
  <text x="710" y="118" text-anchor="middle" class="stage-label">束（Bundle）</text>
  <text x="710" y="148" text-anchor="middle" class="stage-sub">制度化・伝承体系</text>

  <!-- Arrows between stages -->
  <line x1="170" y1="125" x2="198" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD25)"/>
  <line x1="320" y1="125" x2="348" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD25)"/>
  <line x1="470" y1="125" x2="498" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD25)"/>
  <line x1="620" y1="125" x2="648" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrowD25)"/>

  <!-- Concepts under each stage -->

  <!-- 場 concepts — dashed connector and border (correspondence strength: conditional) -->
  <line x1="110" y1="160" x2="110" y2="185" stroke="#8B8682" stroke-width="2" stroke-dasharray="2,3"/>
  <rect x="45" y="185" width="130" height="105" rx="6" fill="none" stroke="#8B8682" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="110" y="207" text-anchor="middle" class="concept">未加工の原材料</text>
  <text x="110" y="225" text-anchor="middle" class="concept">既存の社会構造</text>
  <text x="110" y="243" text-anchor="middle" class="concept">ハビトゥス</text>
  <text x="110" y="265" text-anchor="middle" class="ref">(Leroi-Gourhan/Bourdieu)</text>

  <!-- 波 concepts — solid connector and border -->
  <line x1="260" y1="160" x2="260" y2="185" stroke="#5B8DB8" stroke-width="2"/>
  <rect x="195" y="185" width="130" height="105" rx="6" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
  <text x="260" y="207" text-anchor="middle" class="concept">規範の破れ</text>
  <text x="260" y="225" text-anchor="middle" class="concept">分離(引き剥がし)</text>
  <text x="260" y="243" text-anchor="middle" class="concept">境界侵犯(穢れ)</text>
  <text x="260" y="265" text-anchor="middle" class="ref">(Turner/van Gennep/Douglas)</text>

  <!-- 縁 concepts — solid connector and border -->
  <line x1="410" y1="160" x2="410" y2="185" stroke="#D4A857" stroke-width="2"/>
  <rect x="345" y="185" width="130" height="105" rx="6" fill="none" stroke="#D4A857" stroke-width="1.5"/>
  <text x="410" y="207" text-anchor="middle" class="concept">リミナリティ</text>
  <text x="410" y="225" text-anchor="middle" class="concept">是正行為・贈与接点</text>
  <text x="410" y="243" text-anchor="middle" class="concept">民族境界の維持</text>
  <text x="410" y="265" text-anchor="middle" class="ref">(Turner/Mauss/Barth)</text>

  <!-- 渦 concepts — solid connector and border -->
  <line x1="560" y1="160" x2="560" y2="185" stroke="#C45B4D" stroke-width="2"/>
  <rect x="495" y="185" width="130" height="105" rx="6" fill="none" stroke="#C45B4D" stroke-width="1.5"/>
  <text x="560" y="207" text-anchor="middle" class="concept">コミュニタス成立</text>
  <text x="560" y="225" text-anchor="middle" class="concept">再統合(or 分裂)</text>
  <text x="560" y="243" text-anchor="middle" class="concept">人工物の形成</text>
  <text x="560" y="265" text-anchor="middle" class="ref">(Turner/Leroi-Gourhan)</text>

  <!-- 束 concepts — dashed connector and border (correspondence strength: partial) -->
  <line x1="710" y1="160" x2="710" y2="185" stroke="#5B8B6A" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="645" y="185" width="130" height="105" rx="6" fill="none" stroke="#5B8B6A" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="710" y="207" text-anchor="middle" class="concept">交換体系の制度化</text>
  <text x="710" y="225" text-anchor="middle" class="concept">禁忌・浄化儀礼</text>
  <text x="710" y="243" text-anchor="middle" class="concept">技法の伝承体系</text>
  <text x="710" y="265" text-anchor="middle" class="ref">(Mauss/Douglas/Lemonnier)</text>

  <!-- Legend -->
  <rect x="40" y="310" width="720" height="80" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="333" class="summary-title">対応の強さ</text>
  <line x1="60" y1="353" x2="100" y2="353" stroke="#2C2C2C" stroke-width="2"/>
  <text x="108" y="357" class="legend">強い対応</text>
  <line x1="240" y1="353" x2="280" y2="353" stroke="#2C2C2C" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="288" y="357" class="legend">部分的対応</text>
  <line x1="420" y1="353" x2="460" y2="353" stroke="#D0D0D0" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="468" y="357" class="legend">条件付き対応</text>
  <text x="60" y="378" class="summary-text">確定に近い4件: van Gennep, Turner(社会劇), Turner(リミナリティ), Douglas</text>
  <text x="60" y="393" class="legend">有力5件: Barth, Mauss, Leroi-Gourhan, Lamont &amp; Molnar, Giddens/Bourdieu / 条件付き: Pratt</text>

  <!-- Summary -->
  <rect x="40" y="408" width="720" height="148" rx="6" fill="none" stroke="#E0DDD8" stroke-width="1"/>
  <text x="60" y="430" class="summary-title">全体評価サマリ</text>
  <text x="60" y="452" class="summary-text">10理論中9件で構造対応確認。「縁の学問」として圧倒的密度。</text>
  <text x="60" y="472" class="summary-text">縁に8つの顔: 帯域型/調停型/曖昧型/侵犯型/持続型/交換型/制作型/二層型。</text>
  <text x="60" y="492" class="summary-text">失敗の分岐を理論に内在: 社会劇の「分裂」は渦に至らない経路を示す。</text>
  <text x="60" y="512" class="summary-text">場と束への対応は相対的に弱い（境界に焦点を当てる学問の裏返し）。</text>
  <text x="60" y="532" class="summary-text">操作連鎖と構造化理論が場・束の弱さを部分的に補完。</text>
</svg>
