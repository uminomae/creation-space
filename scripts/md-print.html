<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Markdown Print (Draft)</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 24px;
      font-family: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      background: #fff;
      line-height: 1.5;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin: 0 0 16px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      margin: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <h1 id="print-title">[DRAFT] Markdown PDF Bootstrap</h1>
  <p class="note">This output is provisional and should be refined in the next session.</p>
  <pre id="print-content">loading...</pre>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const src = params.get('src') || '';
      const content = document.getElementById('print-content');
      const title = document.getElementById('print-title');
      const body = document.body;

      function markReady(status, message) {
        if (message) {
          content.textContent = message;
        }
        body.dataset.loadStatus = status;
        body.classList.add('ready');
      }

      function looksLikeHtml(text) {
        const sample = String(text || '').slice(0, 2048).trimStart().toLowerCase();
        if (!sample) return false;
        return (
          sample.startsWith('<!doctype html') ||
          sample.startsWith('<html') ||
          sample.includes('<head') ||
          sample.includes('<body')
        );
      }

      if (!src || src.includes('..') || src.startsWith('/')) {
        markReady('error', 'Invalid src parameter.');
        return;
      }

      try {
        const response = await fetch(src, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        if (looksLikeHtml(text)) {
          throw new Error('Fetched HTML instead of markdown (possible 404/error page).');
        }
        title.textContent = `[DRAFT] ${src}`;
        content.textContent = text;
        markReady('ok');
      } catch (error) {
        markReady('error', `Failed to load markdown: ${error && error.message ? error.message : String(error)}`);
      }
    })();
  </script>
</body>
</html>
